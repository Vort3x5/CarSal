<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Strona główna</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Salon Samochodowy</h1>
        <div class="nav-links" th:if="${username}">
            <span th:text="'Witaj, ' + ${username} + ' (' + ${role} + ')'">Witaj</span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-danger">Wyloguj</button>
            </form>
        </div>
        <div class="nav-links" th:if="${username == null}">
            <a class="btn" th:href="@{/login}">Zaloguj</a>
        </div>
    </div>

    <div th:if="${isAdmin}">
        <h2>Panel Administratora</h2>
        <p>Masz pełny dostęp do zarządzania systemem salonu samochodowego.</p>
        <div class="actions">
            <a class="btn" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="btn" th:href="@{/admin/pojazdy}">Zarządzaj pojazdami</a>
            <a class="btn" th:href="@{/admin/klienci}">Przeglądaj klientów</a>
        </div>
    </div>

    <div th:if="${username != null and !isAdmin}">
        <h2>Panel Klienta</h2>
        <p>Możesz przeglądać dostępne pojazdy oraz edytować swoje dane kontaktowe.</p>
        <div class="actions">
            <a class="btn" th:href="@{/user/pojazdy}">Dostępne pojazdy</a>
            <a class="btn" th:href="@{/user/profile}">Mój profil</a>
            <a class="btn" th:href="@{/user/edit}">Edytuj dane</a>
        </div>
    </div>
</div>
</body>
</html>
