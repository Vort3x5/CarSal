<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edytuj profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edytuj profil</h1>
        <div class="actions">
            <a class="btn" th:href="@{/user/profile}">Anuluj</a>
            <a class="btn" th:href="@{/home}">Strona główna</a>
        </div>
    </div>

    <form th:action="@{/user/update}" th:object="${contact}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="telefon">Telefon: *</label>
            <input id="telefon"
                   th:field="*{telefon}"
                   type="text"
                   required
                   pattern="[0-9\- ]{7,15}"
                   title="7-15 cyfr, dopuszczalne spacje i myślniki">
            <p th:if="${#fields.hasErrors('telefon')}" class="alert alert-error" th:errors="*{telefon}"></p>
        </div>

        <div class="form-group">
            <label for="email">Email: *</label>
            <input id="email"
                   th:field="*{email}"
                   type="email"
                   required
                   maxlength="100">
            <p th:if="${#fields.hasErrors('email')}" class="alert alert-error" th:errors="*{email}"></p>
        </div>

        <div class="actions">
            <button class="btn btn-success" type="submit">Zapisz zmiany</button>
            <a class="btn" th:href="@{/user/profile}">Anuluj</a>
        </div>
    </form>
</div>
</body>
</html>
