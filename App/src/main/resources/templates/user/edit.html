<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj profil - Salon Samochodowy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Edytuj profil</h1>
            <div class="nav-links">
                <a th:href="@{/user/profile}" class="btn" aria-label="Anuluj edycję profilu">Anuluj</a>
                <a th:href="@{/home}" class="btn" aria-label="Przejdź do strony głównej">Strona główna</a>
            </div>
        </div>

        <form th:action="@{/user/update}" th:object="${klient}" method="post">
            <input type="hidden" th:field="*{nrKlienta}">
            <input type="hidden" th:field="*{typKlienta}">
            <input type="hidden" th:field="*{dataRejestracji}">

            <div style="background: #fff3cd; color: #000000; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                <p><strong>Uwaga:</strong> Możesz edytować tylko swoje dane kontaktowe i adres. 
                Dane osobowe (imię, nazwisko, PESEL/NIP) nie mogą być zmieniane.</p>
            </div>

            <h3>Dane kontaktowe</h3>

            <div class="form-group">
                <label for="telefon">Telefon: *</label>
				<input type="text"
					   th:field="*{telefon}"
					   id="telefon"
					   required
					   inputmode="tel"
					   pattern="[0-9+\s-]{7,15}"
					   placeholder="np. 501-234-567">
                <span th:if="${#fields.hasErrors('telefon')}" th:errors="*{telefon}" style="color: red;">Błąd</span>
            </div>

            <div class="form-group">
                <label for="email">Email: *</label>
                <input type="email"
                       th:field="*{email}"
                       id="email"
                       required
                       placeholder="np. jan@example.com">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;">Błąd</span>
            </div>

            <h3>Adres</h3>

            <div class="form-group">
                <label for="ulica">Ulica:</label>
                <input type="text"
                       th:field="*{ulica}"
                       id="ulica"
                       placeholder="np. ul. Kwiatowa 15">
            </div>

            <div class="form-group">
                <label for="kodPocztowy">Kod pocztowy:</label>
                <input type="text"
                       th:field="*{kodPocztowy}"
                       id="kodPocztowy"
                       pattern="[0-9]{2}[-\s]?[0-9]{3}"
                       maxlength="6"
                       placeholder="np. 00-123">
            </div>

            <div class="form-group">
                <label for="miasto">Miasto:</label>
                <input type="text"
                       th:field="*{miasto}"
                       id="miasto"
                       placeholder="np. Warszawa">
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-success">Zapisz zmiany</button>
                <a th:href="@{/user/profile}" class="btn btn-danger">Anuluj</a>
            </div>
        </form>
    </div>
</body>
</html>
