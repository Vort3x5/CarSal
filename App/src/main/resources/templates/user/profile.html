<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mój profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Mój profil</h1>
        <div class="actions">
            <a class="btn" th:href="@{/home}">Strona główna</a>
            <a class="btn" th:href="@{/user/edit}">Edytuj profil</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-danger">Wyloguj</button>
            </form>
        </div>
    </div>

    <h3>Dane osobowe</h3>

    <p><strong>Typ klienta:</strong> <span th:text="${klient.typKlienta}">-</span></p>
    <p>
        <strong>Imię i nazwisko:</strong>
        <span th:text="${klient.imie}">-</span>
        <span th:text="${klient.nazwisko}">-</span>
    </p>
    <p><strong>PESEL:</strong> <span th:text="${klient.pesel}">-</span></p>
    <p><strong>Nazwa firmy:</strong> <span th:text="${klient.nazwaFirmy}">-</span></p>
    <p><strong>NIP:</strong> <span th:text="${klient.nip}">-</span></p>
    <p><strong>Telefon:</strong> <span th:text="${klient.telefon}">-</span></p>
    <p><strong>Email:</strong> <span th:text="${klient.email}">-</span></p>
    <p>
        <strong>Data rejestracji:</strong>
        <span th:text="${klient.dataRejestracji}">-</span>
    </p>

    <p><strong>ℹ️ Informacja:</strong> Możesz edytować swoje dane kontaktowe, klikając przycisk „Edytuj profil” powyżej.</p>
</div>
</body>
</html>
