<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Logowanie | Salon Samochodowy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="auth-card">
        <div class="auth-illustration car-illustration"></div>
        <div class="auth-form">
            <h2>Salon Samochodowy</h2>
            <h3>Logowanie</h3>

            <div class="alert alert-error" th:if="${error}">
                <span th:text="${error}">Błąd logowania</span>
            </div>
            <div class="alert alert-success" th:if="${message}">
                <span th:text="${message}">Komunikat</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Nazwa użytkownika:</label>
                    <input id="username" type="text" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Hasło:</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-success" type="submit">Zaloguj się</button>
            </form>

            <p class="auth-switch">Nie masz konta?
                <a th:href="@{/register}">Utwórz konto</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
