<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Salon Samochodowy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <h2>Salon Samochodowy</h2>
        <h3>Logowanie</h3>
        
        <div th:if="${error}" class="alert alert-error">
            <p th:text="${error}">Błąd logowania</p>
        </div>
        
        <div th:if="${message}" class="alert alert-success">
            <p th:text="${message}">Komunikat</p>
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Nazwa użytkownika:</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Wpisz nazwę użytkownika">
            </div>
            
            <div class="form-group">
                <label for="password">Hasło:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Wpisz hasło">
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">Zaloguj się</button>
        </form>
        
        <div style="margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 5px; border: 1px solid #404040;">
            <p style="margin-bottom: 10px; font-weight: bold; color: #f5f5f5;">Konta testowe:</p>
            <p style="color: #e0e0e0;"><strong>Admin:</strong> admin / admin123</p>
            <p style="color: #e0e0e0;"><strong>Klient 1:</strong> klient1 / klient123</p>
            <p style="color: #e0e0e0;"><strong>Klient 2:</strong> klient2 / klient123</p>
        </div>
    </div>
</body>
</html>
