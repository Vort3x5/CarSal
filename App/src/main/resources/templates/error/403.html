<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container error-page">
    <h1>403</h1>
    <h2>Brak dostępu</h2>
    <p>Nie masz uprawnień do wyświetlenia tej strony.</p>

    <p><strong>Co się stało?</strong></p>
    <p>Próbowałeś uzyskać dostęp do zasobu, do którego nie masz uprawnień.</p>
    <p>Jeśli uważasz, że to błąd, skontaktuj się z administratorem systemu.</p>

    <div class="actions">
        <a class="btn" th:href="@{/home}">Strona główna</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger">Wyloguj</button>
        </form>
    </div>
</div>
</body>
</html>
