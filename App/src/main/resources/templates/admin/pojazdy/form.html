<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pojazd.nrVin != null ? 'Edytuj pojazd' : 'Dodaj pojazd'}">Pojazd</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${pojazd.nrVin != null ? 'Edytuj pojazd' : 'Dodaj nowy pojazd'}">Pojazd</h1>
            <div class="nav-links">
                <a th:href="@{/admin/pojazdy}" class="btn">Powrót do listy</a>
                <a th:href="@{/admin/dashboard}" class="btn">Dashboard</a>
            </div>
        </div>
        
        <form th:action="@{/admin/pojazdy/save}" th:object="${pojazd}" method="post">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="nrVin">Numer VIN: *</label>
                    <input type="text" th:field="*{nrVin}" id="nrVin" required 
                           maxlength="17" placeholder="17-znakowy numer VIN"
                           th:readonly="${pojazd.nrVin != null}">
                    <span th:if="${#fields.hasErrors('nrVin')}" th:errors="*{nrVin}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="idModelu">Model: *</label>
                    <select th:field="*{idModelu}" id="idModelu" required>
                        <option value="">-- Wybierz model --</option>
                        <option th:each="model : ${modele}" 
                                th:value="${model.idModelu}" 
                                th:text="${model.fullName}">Model</option>
                    </select>
                    <span th:if="${#fields.hasErrors('idModelu')}" th:errors="*{idModelu}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="nrSalonu">Salon: *</label>
                    <select th:field="*{nrSalonu}" id="nrSalonu" required>
                        <option value="">-- Wybierz salon --</option>
                        <option th:each="salon : ${salony}" 
                                th:value="${salon.nrSalonu}" 
                                th:text="${salon.displayName}">Salon</option>
                    </select>
                    <span th:if="${#fields.hasErrors('nrSalonu')}" th:errors="*{nrSalonu}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="rokProdukcji">Rok produkcji: *</label>
                    <input type="number" th:field="*{rokProdukcji}" id="rokProdukcji" required 
                           min="1900" max="2025" placeholder="np. 2023">
                    <span th:if="${#fields.hasErrors('rokProdukcji')}" th:errors="*{rokProdukcji}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="przebieg">Przebieg (km):</label>
                    <input type="number" th:field="*{przebieg}" id="przebieg" 
                           min="0" placeholder="np. 50000">
                </div>
                
                <div class="form-group">
                    <label for="kolor">Kolor:</label>
                    <input type="text" th:field="*{kolor}" id="kolor" 
                           placeholder="np. Czerwony">
                </div>
                
                <div class="form-group">
                    <label for="cenaKatalogowa">Cena katalogowa (PLN): *</label>
                    <input type="number" step="0.01" th:field="*{cenaKatalogowa}" id="cenaKatalogowa" required 
                           placeholder="np. 75000.00">
                    <span th:if="${#fields.hasErrors('cenaKatalogowa')}" th:errors="*{cenaKatalogowa}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="stan">Stan: *</label>
                    <select th:field="*{stan}" id="stan" required>
                        <option value="">-- Wybierz stan --</option>
                        <option value="Nowy">Nowy</option>
                        <option value="Uzywany">Używany</option>
                    </select>
                    <span th:if="${#fields.hasErrors('stan')}" th:errors="*{stan}" 
                          style="color: red;">Błąd</span>
                </div>
                
                <div class="form-group">
                    <label for="status">Status: *</label>
                    <select th:field="*{status}" id="status" required>
                        <option value="">-- Wybierz status --</option>
                        <option value="Dostepny">Dostępny</option>
                        <option value="Sprzedany">Sprzedany</option>
                        <option value="Rezerwacja">Rezerwacja</option>
                        <option value="Serwis">Serwis</option>
                    </select>
                    <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" 
                          style="color: red;">Błąd</span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="uwagi">Uwagi:</label>
                <textarea th:field="*{uwagi}" id="uwagi" rows="4" 
                          placeholder="Dodatkowe informacje o pojeździe"></textarea>
            </div>
            
            <div class="actions">
                <button type="submit" class="btn btn-success">
                    <span th:text="${pojazd.nrVin != null ? 'Zapisz zmiany' : 'Dodaj pojazd'}">Zapisz</span>
                </button>
                <a th:href="@{/admin/pojazdy}" class="btn btn-danger">Anuluj</a>
            </div>
        </form>
    </div>
</body>
</html>
