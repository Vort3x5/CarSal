<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Administratora</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Panel Administratora</h1>
        <div class="nav-links">
            <a class="btn" th:href="@{/home}">Strona główna</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-danger">Wyloguj</button>
            </form>
        </div>
    </div>

    <h2>Witaj w panelu zarządzania</h2>

    <div class="stats">
        <div class="stat-card">
            <p>Liczba pojazdów</p>
            <h3 th:text="${totalPojazdy}">0</h3>
        </div>
        <div class="stat-card">
            <p>Liczba klientów</p>
            <h3 th:text="${totalKlienci}">0</h3>
        </div>
    </div>

    <h3>Szybkie akcje</h3>
    <div class="actions">
        <a class="btn" th:href="@{/admin/pojazdy}">Zarządzaj pojazdami</a>
        <a class="btn" th:href="@{/admin/pojazdy/new}">Dodaj nowy pojazd</a>
        <a class="btn" th:href="@{/admin/klienci}">Przeglądaj klientów</a>
    </div>
</div>
</body>
</html>
