<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie pojazdami - Panel Administratora</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Zarządzanie pojazdami</h1>
            <div class="nav-links">
                <a th:href="@{/admin/dashboard}" class="btn">Dashboard</a>
                <a th:href="@{/admin/pojazdy/new}" class="btn btn-success">Dodaj pojazd</a>
                <a th:href="@{/home}" class="btn">Strona główna</a>
            </div>
        </div>
        
        <div th:if="${success}" class="alert alert-success">
            <p th:text="${success}">Sukces!</p>
        </div>
        
        <div th:if="${error}" class="alert alert-error">
            <p th:text="${error}">Błąd!</p>
        </div>
        
        <p>Łączna liczba pojazdów: <strong th:text="${pojazdy.size()}">0</strong></p>
        
        <table>
            <thead>
                <tr>
                    <th>Nr VIN</th>
                    <th>Model</th>
                    <th>Rok</th>
                    <th>Kolor</th>
                    <th>Cena</th>
                    <th>Stan</th>
                    <th>Status</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${pojazdy.empty}">
                    <td colspan="8" style="text-align: center; padding: 30px;">
                        Brak pojazdów w bazie danych
                    </td>
                </tr>
                <tr th:each="pojazd : ${pojazdy}">
                    <td th:text="${pojazd.nrVin}">-</td>
                    <td th:text="${pojazd.model != null ? pojazd.model.nazwaModelu : 'Brak modelu'}">-</td>
                    <td th:text="${pojazd.rokProdukcji}">-</td>
                    <td th:text="${pojazd.kolor}">-</td>
                    <td th:text="${#numbers.formatDecimal(pojazd.cenaKatalogowa, 1, 2) + ' PLN'}">-</td>
                    <td th:text="${pojazd.stan}">-</td>
                    <td th:text="${pojazd.status}">-</td>
                    <td>
                        <a th:href="@{/admin/pojazdy/edit/{id}(id=${pojazd.nrVin})}" 
                           class="btn" style="font-size: 12px; padding: 5px 10px;">Edytuj</a>
                        <a th:href="@{/admin/pojazdy/delete/{id}(id=${pojazd.nrVin})}" 
                           class="btn btn-danger" style="font-size: 12px; padding: 5px 10px;"
                           onclick="return confirm('Czy na pewno chcesz usunąć ten pojazd?');">Usuń</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
